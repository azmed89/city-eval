services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # localhost only, don't expose it publicly
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  eval:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      API_BIND_HOST: 0.0.0.0
      OLLAMA_URL: http://ollama:11434
      MODEL: qwen2.5:3b
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results

volumes:
  ollama: